<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly — Premium Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FFCB3D;
      --yellow-dark: #F5A623;
      --cream: #FAF9F5;
      --white: #FFFFFF;
      --ink: #1E1E2D;
      --gray: #7E7E8F;
      --gray-light: #F1F1F5;
      --line: #E5E5EB;
      --teal: #14B8A6;
      --teal-hover: #0D9488;
      --teal-light: #CCFBF1;
      --danger: #EF4444;
      --danger-light: #FEE2E2;
      --radius: 18px;
      --shadow: 0 12px 36px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111119;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* Mobile Container Frame */
    .app-viewport {
      width: 100%;
      max-width: 440px;
      height: 820px;
      background: var(--cream);
      border-radius: 36px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      border: 8px solid #2B2B3C;
    }

    /* Header */
    .header {
      background: var(--yellow);
      padding: 24px 20px 20px;
      position: relative;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
    }
    .avatar {
      width: 38px;
      height: 38px;
      background: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .sub-text {
      font-size: 13px;
      color: #6B5A12;
      font-weight: 500;
    }

    /* Search Bar */
    .search-box {
      margin: 12px 16px 6px;
      background: var(--white);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 8px 14px;
      border: 1px solid var(--line);
    }
    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      margin-left: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    /* Category List */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 80px;
    }

    .category-card {
      background: var(--white);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .category-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-chip {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .cat-name { font-size: 15px; font-weight: 600; color: var(--ink); }
    .cat-count { font-size: 12px; color: var(--gray); }

    /* Task Card */
    .task-card {
      background: var(--white);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      transition: all 0.2s;
    }
    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--gray);
    }
    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--line);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .checkbox.checked {
      background: var(--teal);
      border-color: var(--teal);
      color: white;
    }
    .task-title { font-size: 14px; font-weight: 600; flex: 1; }

    .prio-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .prio-high { background: var(--danger-light); color: var(--danger); }
    .prio-medium { background: #FFEDD5; color: #F97316; }
    .prio-low { background: #D1FAE5; color: #10B981; }

    /* FAB */
    .fab {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      background: var(--teal);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(20, 184, 166, 0.4);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .fab:hover { transform: scale(1.08); background: var(--teal-hover); }

    /* Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-sheet {
      width: 100%;
      background: var(--white);
      border-radius: 28px 28px 0 0;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-primary { background: var(--teal); color: white; }
    .btn-secondary { background: var(--gray-light); color: var(--ink); }
    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      margin-bottom: 12px;
      font-family: inherit;
    }
  </style>
</head>
<body>

<div class="app-viewport">
  <div class="header">
    <div class="header-top">
      <div class="brand-title">Taskly</div>
      <div class="avatar">E</div>
    </div>
    <div class="sub-text" id="header-subtitle">Loading tasks...</div>
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="Search tasks..." onkeyup="renderTasks()">
  </div>

  <div class="content-area" id="main-content">
    <!-- Rendered dynamically -->
  </div>

  <div class="fab" onclick="openAddTaskModal()">+</div>

  <!-- Modal Sheet -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <h3 style="margin-bottom: 16px;" id="modal-title">Add New Task</h3>
      <input type="text" id="task-title-input" class="input-field" placeholder="What needs to be done?">
      
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <select id="task-cat-select" class="input-field" style="margin-bottom: 0;">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Shopping">Shopping</option>
        </select>
        <select id="task-prio-select" class="input-field" style="margin-bottom: 0;">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('taskly_tasks') || '[]');

  if (tasks.length === 0) {
    tasks = [
      { id: '1', title: 'Buy groceries', category: 'Shopping', priority: 'High', completed: false, due_date: '' },
      { id: '2', title: 'Finish project report', category: 'Work', priority: 'Medium', completed: false, due_date: '' },
      { id: '3', title: 'Morning workout', category: 'Personal', priority: 'Low', completed: true, due_date: '' }
    ];
    save();
  }

  function save() {
    localStorage.setItem('taskly_tasks', JSON.stringify(tasks));
  }

  function renderTasks() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const container = document.getElementById('main-content');
    const filtered = tasks.filter(t => t.title.toLowerCase().includes(q));

    document.getElementById('header-subtitle').innerText = `You have ${tasks.filter(t => !t.completed).length} pending tasks`;

    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align: center; color: var(--gray); padding: 40px;">No tasks found</div>';
      return;
    }

    container.innerHTML = filtered.map(t => `
      <div class="task-card ${t.completed ? 'completed' : ''}">
        <div class="checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTask('${t.id}')">
          ${t.completed ? '✓' : ''}
        </div>
        <div class="task-title">${t.title}</div>
        <span class="prio-pill prio-${t.priority.toLowerCase()}">${t.priority}</span>
        <span onclick="deleteTask('${t.id}')" style="cursor: pointer; color: var(--gray); font-size: 14px; margin-left: 8px;">✕</span>
      </div>
    `).join('');
  }

  function toggleTask(id) {
    const t = tasks.find(x => x.id === id);
    if (t) t.completed = !t.completed;
    save();
    renderTasks();
  }

  function deleteTask(id) {
    tasks = tasks.filter(x => x.id !== id);
    save();
    renderTasks();
  }

  function openAddTaskModal() {
    document.getElementById('modal-overlay').classList.add('active');
    document.getElementById('task-title-input').focus();
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
    document.getElementById('task-title-input').value = '';
  }

  function saveTask() {
    const title = document.getElementById('task-title-input').value.strip ? document.getElementById('task-title-input').value.trim() : document.getElementById('task-title-input').value;
    if (!title) return;

    tasks.push({
      id: Date.now().toString(),
      title: title,
      category: document.getElementById('task-cat-select').value,
      priority: document.getElementById('task-prio-select').value,
      completed: false,
      due_date: ''
    });

    save();
    renderTasks();
    closeModal();
  }

  renderTasks();
</script>
</body>
</html>

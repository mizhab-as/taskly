<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskly — Get Organized Your Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E6;
    --cream-deep:#F3E6CE;
    --white:#FFFFFF;
    --ink:#2B2440;
    --ink-soft:#786E8C;
    --ink-faint:#B5ACC4;
    --teal:#17B897;
    --teal-deep:#0E8F76;
    --teal-tint:#DFF7EF;
    --coral:#FF6B5C;
    --coral-tint:#FFE4E0;
    --amber:#F7B733;
    --amber-tint:#FFF1D2;
    --lilac:#9C8CFF;
    --lilac-tint:#EDE8FF;
    --sky:#4FB3E8;
    --sky-tint:#E2F4FF;
    --pink:#FF8FBB;
    --pink-tint:#FFE6F0;
    --radius-lg:28px;
    --radius-md:20px;
    --radius-sm:14px;
    --shadow-soft:0 10px 30px rgba(43,36,64,0.08);
    --shadow-pop:0 16px 40px rgba(43,36,64,0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle, rgba(43,36,64,.06) 1.4px, transparent 1.4px) 0 0/22px 22px,
      var(--cream);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}

  /* ---------- Ambient background graphics ---------- */
  .bg-decor{
    position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  }
  .bg-decor span{
    position:absolute;display:block;
    border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;
    filter:blur(2px);opacity:.5;
  }
  .bg-decor span.b1{width:340px;height:340px;top:-120px;right:-90px;background:radial-gradient(circle at 35% 30%, var(--pink-tint), var(--lilac-tint) 70%);}
  .bg-decor span.b2{width:260px;height:260px;bottom:-100px;left:-80px;background:radial-gradient(circle at 40% 35%, var(--teal-tint), var(--sky-tint) 75%);}
  .bg-decor span.b3{width:180px;height:180px;bottom:14%;right:6%;background:radial-gradient(circle at 40% 35%, var(--amber-tint), var(--cream-deep) 75%);opacity:.45;}
  .bg-decor span.b4{width:130px;height:130px;top:38%;left:2%;background:radial-gradient(circle at 40% 35%, var(--sky-tint), var(--white) 75%);opacity:.35;display:none;}
  #app{position:relative;z-index:1;}

  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input{font-family:inherit;}

  /* ---------- Blob badge shapes (signature element) ---------- */
  .blob{
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
    display:flex;align-items:center;justify-content:center;
    transition:border-radius .5s ease, transform .35s ease;
    flex-shrink:0;
  }
  .blob:hover{
    border-radius: 58% 42% 37% 63% / 55% 60% 40% 45%;
    transform:rotate(-4deg) scale(1.04);
  }

  /* ---------- App shell ---------- */
  #app{display:flex;min-height:100vh;}

  /* Sidebar (desktop) / Drawer (mobile) */
  .sidebar{
    width:264px;flex-shrink:0;
    background:var(--white);
    padding:28px 20px;
    display:flex;flex-direction:column;gap:26px;
    box-shadow: var(--shadow-soft);
    position:relative;z-index:20;
    overflow:hidden;
  }
  .sidebar::before{
    content:"";position:absolute;top:-60px;left:-60px;width:160px;height:160px;
    background:var(--teal-tint);border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;
    z-index:0;opacity:.7;
  }
  .sidebar::after{
    content:"";position:absolute;bottom:120px;right:-50px;width:110px;height:110px;
    background:var(--pink-tint);border-radius:58% 42% 37% 63% / 55% 60% 40% 45%;
    z-index:0;opacity:.6;
  }
  .sidebar > *{position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
  .brand .mark{
    width:38px;height:38px;background:var(--teal);
    color:white;font-size:20px;font-weight:800;
  }
  .brand span{font-size:22px;font-weight:700;}

  .nav-group{display:flex;flex-direction:column;gap:4px;}
  .nav-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;margin:10px 10px 4px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 12px;border-radius:14px;
    font-weight:600;font-size:14.5px;color:var(--ink-soft);
    transition:background .2s ease, color .2s ease;
    text-align:left;width:100%;
  }
  .nav-item .ic{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .nav-item:hover{background:var(--cream);color:var(--ink);}
  .nav-item.active{background:var(--teal-tint);color:var(--teal-deep);}
  .nav-item .count{margin-left:auto;font-size:12px;font-weight:700;background:var(--cream-deep);color:var(--ink-soft);padding:2px 8px;border-radius:20px;}
  .nav-item.active .count{background:var(--teal);color:white;}

  .sidebar-footer{margin-top:auto;background:var(--amber-tint);border-radius:var(--radius-md);padding:16px;position:relative;overflow:hidden;}
  .sidebar-footer::after{
    content:"";position:absolute;top:-24px;right:-24px;width:70px;height:70px;
    background:rgba(255,255,255,.55);border-radius:58% 42% 37% 63% / 55% 60% 40% 45%;
  }
  .sidebar-footer p{margin:0 0 10px;font-size:13px;font-weight:600;color:#8A6415;line-height:1.4;position:relative;z-index:1;}
  .sidebar-footer button{background:var(--amber);color:#4A3200;font-weight:700;font-size:13px;padding:8px 14px;border-radius:12px;position:relative;z-index:1;}

  .drawer-close, .hamburger{display:none;}

  /* Main column */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:20px 36px;position:sticky;top:0;
    background:rgba(251,243,230,.85);backdrop-filter:blur(10px);
    z-index:10;
  }
  .search{
    flex:1;max-width:420px;display:flex;align-items:center;gap:10px;
    background:var(--white);border-radius:16px;padding:10px 16px;
    box-shadow:var(--shadow-soft);
  }
  .search input{border:none;outline:none;background:none;font-size:14px;width:100%;color:var(--ink);}
  .search input::placeholder{color:var(--ink-faint);}
  .topbar .spacer{flex:1;}
  .avatar{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(160deg, var(--lilac) 0%, var(--pink) 130%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-soft);flex-shrink:0;overflow:hidden;
  }
  .avatar svg{width:100%;height:100%;display:block;}

  .content{padding:8px 36px 60px;max-width:1080px;width:100%;margin:0 auto;}

  /* ---------- Dashboard ---------- */
  .hero{
    background:linear-gradient(135deg,var(--white) 0%, var(--cream-deep) 130%);
    border-radius:var(--radius-lg);padding:32px 34px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    box-shadow:var(--shadow-soft);margin-bottom:28px;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    background:var(--amber-tint);border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;z-index:0;
  }
  .hero-text{position:relative;z-index:1;}
  .hero-text h1{margin:0 0 6px;font-size:28px;}
  .hero-text p{margin:0;color:var(--ink-soft);font-size:15px;font-weight:500;}
  .hero-emoji{position:relative;z-index:1;filter:drop-shadow(0 8px 16px rgba(43,36,64,.15));flex-shrink:0;}
  .hero-emoji svg{width:150px;height:120px;display:block;}

  .section-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 14px 4px;}

  .lists-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:16px;margin-bottom:34px;
  }
  .list-card{
    background:var(--white);border-radius:var(--radius-md);padding:20px;
    display:flex;flex-direction:column;gap:14px;
    box-shadow:var(--shadow-soft);cursor:pointer;text-align:left;
    transition:transform .2s ease, box-shadow .2s ease;
    position:relative;overflow:hidden;
  }
  .list-card::after{
    content:"";position:absolute;bottom:-22px;left:-22px;width:64px;height:64px;
    background:radial-gradient(circle, rgba(43,36,64,.05) 1.6px, transparent 1.6px) 0 0/12px 12px;
    border-radius:50%;pointer-events:none;
  }
  .list-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-pop);}
  .list-card .blob{width:52px;height:52px;font-size:24px;position:relative;z-index:1;}
  .list-card h3{margin:0;font-size:17px;position:relative;z-index:1;}
  .list-card .meta{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
  .list-card > div{position:relative;z-index:1;}
  .list-card .meta span{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .list-card .badge{
    background:var(--coral-tint);color:var(--coral);font-weight:800;font-size:12px;
    width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .new-list-card{
    border:2px dashed var(--ink-faint);border-radius:var(--radius-md);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    padding:20px;color:var(--ink-soft);font-weight:700;font-size:14px;
    background:transparent;min-height:120px;transition:all .2s ease;
  }
  .new-list-card:hover{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-tint);}
  .new-list-card .plus-ic{width:34px;height:34px;border-radius:50%;background:var(--cream-deep);display:flex;align-items:center;justify-content:center;font-size:18px;}

  .overview-card{
    background:var(--white);border-radius:var(--radius-lg);padding:28px 30px;
    box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:34px;flex-wrap:wrap;
  }
  .ring-wrap{display:flex;align-items:center;gap:16px;}
  .stat{display:flex;flex-direction:column;}
  .stat .num{font-family:'Baloo 2';font-size:26px;font-weight:700;}
  .stat .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .stat.done .num{color:var(--teal-deep);}
  .stat.pending .num{color:var(--coral);}
  .overview-divider{width:1px;align-self:stretch;background:var(--cream-deep);}

  /* ---------- List Detail ---------- */
  .list-header{
    display:flex;align-items:center;gap:18px;margin-bottom:22px;
  }
  .back-btn{
    display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--ink-soft);
    padding:8px 4px;
  }
  .back-btn:hover{color:var(--ink);}
  .list-header .blob{width:58px;height:58px;font-size:26px;}
  .list-header h2{margin:0;font-size:24px;}
  .list-header .sub{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;font-weight:600;}

  .tabs{display:flex;gap:6px;background:var(--white);padding:5px;border-radius:16px;box-shadow:var(--shadow-soft);width:fit-content;margin-bottom:20px;}
  .tab{padding:9px 20px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--ink-soft);}
  .tab.active{background:var(--teal);color:white;}

  .task-list{display:flex;flex-direction:column;gap:12px;}
  .task-row{
    background:var(--white);border-radius:var(--radius-md);
    padding:16px 18px;display:flex;align-items:center;gap:14px;
    box-shadow:var(--shadow-soft);transition:box-shadow .2s ease, opacity .2s ease;
    border-left:5px solid transparent;
  }
  .task-row:hover{box-shadow:var(--shadow-pop);}
  .task-row.priority-High{border-left-color:var(--coral);}
  .task-row.priority-Medium{border-left-color:var(--amber);}
  .task-row.priority-Low{border-left-color:var(--teal);}

  .checkbox{
    width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink-faint);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:all .2s ease;font-size:13px;color:white;
  }
  .checkbox.checked{background:var(--teal);border-color:var(--teal);}

  .task-body{flex:1;min-width:0;}
  .task-title{font-weight:700;font-size:15px;margin:0 0 6px;transition:color .2s ease;}
  .task-row.done .task-title{text-decoration:line-through;color:var(--ink-faint);}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;letter-spacing:.02em;}
  .pill.High{background:var(--coral-tint);color:var(--coral);}
  .pill.Medium{background:var(--amber-tint);color:#8A6415;}
  .pill.Low{background:var(--teal-tint);color:var(--teal-deep);}

  .task-actions{display:flex;align-items:center;gap:6px;}
  .icon-btn{
    width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);transition:all .2s ease;font-size:14px;
  }
  .icon-btn:hover{background:var(--coral-tint);color:var(--coral);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .empty-state .em{margin-bottom:6px;}
  .empty-state .em svg{width:120px;height:100px;}
  .empty-state p{font-weight:600;margin:0;}

  /* Add task */
  .add-row{
    background:var(--white);border-radius:var(--radius-md);padding:12px 14px;
    display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-soft);margin-bottom:16px;
  }
  .add-row input{flex:1;border:none;outline:none;font-size:14.5px;padding:8px 4px;background:none;color:var(--ink);}
  .add-row select{border:none;outline:none;background:var(--cream);border-radius:10px;padding:8px 10px;font-weight:700;font-size:12.5px;color:var(--ink-soft);}
  .add-row button.submit{background:var(--teal);color:white;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:12px;flex-shrink:0;}

  .fab{
    position:fixed;bottom:28px;right:28px;width:58px;height:58px;border-radius:50%;
    background:var(--teal);color:white;font-size:26px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 28px rgba(23,184,151,.45);z-index:30;transition:transform .2s ease;
  }
  .fab:hover{transform:scale(1.08) rotate(90deg);}

  /* ---------- Responsive: tablet & mobile ---------- */
  .overlay{display:none;}

  @media (max-width: 900px){
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);
      transition:transform .3s ease;width:80%;max-width:300px;
    }
    .sidebar.open{transform:translateX(0);}
    .drawer-close{display:flex;margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--cream);align-items:center;justify-content:center;color:var(--ink-soft);}
    .hamburger{
      display:flex;width:40px;height:40px;border-radius:12px;background:var(--white);
      box-shadow:var(--shadow-soft);align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
    }
    .overlay{
      display:none;position:fixed;inset:0;background:rgba(43,36,64,.35);z-index:15;
    }
    .overlay.show{display:block;}
    .topbar{padding:16px 18px;}
    .content{padding:4px 18px 90px;}
    .hero{padding:24px 20px;flex-direction:column;align-items:flex-start;gap:14px;}
    .hero-emoji{align-self:center;}
    .hero-emoji svg{width:120px;height:96px;}
    .bg-decor span.b1{width:220px;height:220px;top:-90px;right:-70px;}
    .bg-decor span.b2{width:170px;height:170px;}
    .overview-card{flex-direction:column;align-items:stretch;gap:18px;}
    .overview-divider{display:none;}
    .lists-grid{grid-template-columns:1fr 1fr;gap:12px;}
    .search{max-width:none;}
    .fab{bottom:20px;right:20px;width:52px;height:52px;font-size:22px;}
  }

  @media (max-width: 520px){
    .lists-grid{grid-template-columns:1fr;}
    .brand span{font-size:19px;}
    .hero-text h1{font-size:22px;}
    .task-row{padding:14px;gap:10px;}
    .task-actions .icon-btn:first-child{display:none;}
    .list-header h2{font-size:20px;}
  }
</style>
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <span class="b1"></span>
  <span class="b2"></span>
  <span class="b3"></span>
  <span class="b4"></span>
</div>

<div id="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div style="display:flex;align-items:center;">
      <div class="brand">
        <div class="blob mark">T</div>
        <span>Taskly</span>
      </div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>

    <div class="nav-group" id="navLists">
      <div class="nav-label">My Lists</div>
      <!-- nav items injected by JS -->
    </div>

    <div class="sidebar-footer">
      <p>You're 33% through your week. Keep the streak going! 🔥</p>
      <button id="addListBtn">+ New list</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <div class="search">
        <span>🔍</span>
        <input type="text" placeholder="Search tasks...">
      </div>
      <div class="spacer"></div>
      <div class="avatar" title="Ender">
        <svg viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
          <circle cx="21" cy="17" r="8.5" fill="#FFE8CF"/>
          <path d="M8 41c0-9.4 7.7-15.5 13-15.5S34 31.6 34 41Z" fill="#FFE8CF"/>
          <path d="M13 15c0-6 4-9.5 8-9.5s8 3.5 8 9.5c0 1-3 2.5-8 2.5s-8-1.5-8-2.5Z" fill="#4A3B63"/>
          <circle cx="17.6" cy="17.5" r="1.3" fill="#4A3B63"/>
          <circle cx="24.4" cy="17.5" r="1.3" fill="#4A3B63"/>
          <path d="M18.3 21.3c.9.7 2.6.7 3.4 0" stroke="#C77B4F" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>

    <div class="content" id="content">
      <!-- view injected by JS -->
    </div>
  </div>

  <button class="fab" id="fab">+</button>
</div>

<script>
/* ---------------- Data model ---------------- */
const LIST_META = {
  today:    { name:"Today",    emoji:"☀️", bg:"var(--amber-tint)" },
  planned:  { name:"Planned",  emoji:"📅", bg:"var(--sky-tint)" },
  personal: { name:"Personal", emoji:"🙂", bg:"var(--lilac-tint)" },
  work:     { name:"Work",     emoji:"💼", bg:"var(--cream-deep)" },
  shopping: { name:"Shopping", emoji:"🛍️", bg:"var(--pink-tint)" },
};

let tasks = [
  { id:1, list:"personal", title:"Go to gym",        priority:"High",   done:false },
  { id:2, list:"personal", title:"Meet friends",      priority:"Medium", done:false },
  { id:3, list:"personal", title:"Buy theatre ticket",priority:"Medium", done:false },
  { id:4, list:"personal", title:"Go to Market",      priority:"Low",    done:true  },
  { id:5, list:"personal", title:"Change your picture",priority:"Low",   done:true  },
  { id:6, list:"personal", title:"Watch Westworld",   priority:"Low",    done:true  },
  { id:7, list:"work",     title:"Send project files",priority:"High",  done:false },
  { id:8, list:"work",     title:"Pay bills",         priority:"Medium", done:false },
  { id:9, list:"shopping", title:"Add your portfolio",priority:"Low",    done:false },
];
let nextId = 10;

let state = { view:"dashboard", list:"personal", tab:"All" };

/* ---------------- Helpers ---------------- */
const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };

function tasksFor(listId){ return tasks.filter(t=>t.list===listId); }
function pendingCount(listId){ return tasksFor(listId).filter(t=>!t.done).length; }

/* ---------------- Sidebar nav ---------------- */
function renderNav(){
  const nav = $("#navLists");
  nav.innerHTML = "";
  Object.keys(LIST_META).forEach(id=>{
    const meta = LIST_META[id];
    const count = tasksFor(id).length;
    const btn = el("button", "nav-item" + (state.list===id && state.view==="list" ? " active":""));
    btn.innerHTML = `<span class="ic" style="background:${meta.bg}">${meta.emoji}</span> ${meta.name} ${count?`<span class="count">${count}</span>`:""}`;
    btn.onclick = ()=>{ state.view="list"; state.list=id; state.tab="All"; closeDrawer(); render(); };
    nav.appendChild(btn);
  });
}

/* ---------------- Dashboard view ---------------- */
function renderDashboard(container){
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const pending = total-done;
  const pct = total ? Math.round(done/total*100) : 0;

  const hero = el("div","hero",`
    <div class="hero-text">
      <h1>Good evening, Ender 👋</h1>
      <p>${pending===0 ? "Nothing due today — enjoy the calm! 🎉" : `You have ${pending} tasks waiting for you.`}</p>
    </div>
    <div class="hero-emoji">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="146" rx="70" ry="8" fill="var(--cream-deep)"/>
        <circle cx="150" cy="30" r="18" fill="var(--amber)" opacity=".9"/>
        <path d="M40 60 q14 -12 28 0" stroke="var(--sky)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".7"/>
        <path d="M30 74 q14 -12 28 0" stroke="var(--sky)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".45"/>
        <rect x="58" y="86" width="58" height="42" rx="8" fill="var(--white)" stroke="var(--cream-deep)" stroke-width="2"/>
        <rect x="68" y="96" width="26" height="5" rx="2.5" fill="var(--teal-tint)"/>
        <rect x="68" y="96" width="20" height="5" rx="2.5" fill="var(--teal)"/>
        <rect x="68" y="107" width="26" height="5" rx="2.5" fill="var(--coral-tint)"/>
        <rect x="68" y="107" width="12" height="5" rx="2.5" fill="var(--coral)"/>
        <rect x="68" y="118" width="26" height="5" rx="2.5" fill="var(--amber-tint)"/>
        <circle cx="100" cy="70" r="17" fill="#FFE8CF"/>
        <path d="M84 63c0-10 7-15 16-15s16 5 16 15c0 2-6 4-16 4s-16-2-16-4Z" fill="#4A3B63"/>
        <circle cx="95" cy="70" r="1.6" fill="#4A3B63"/>
        <circle cx="105" cy="70" r="1.6" fill="#4A3B63"/>
        <path d="M95 74.5c1.4 1.1 4.1 1.1 5.6 0" stroke="#C77B4F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M82 84c4-6 10-9 18-9s14 3 18 9" stroke="var(--lilac)" stroke-width="6" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
  `);
  container.appendChild(hero);

  container.appendChild(el("div","section-title","My Lists"));
  const grid = el("div","lists-grid");
  Object.keys(LIST_META).forEach(id=>{
    const meta = LIST_META[id];
    const count = tasksFor(id).length;
    const pend = pendingCount(id);
    const card = el("button","list-card");
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div class="blob" style="background:${meta.bg}">${meta.emoji}</div>
        ${pend?`<div class="badge">${pend}</div>`:""}
      </div>
      <h3>${meta.name}</h3>
      <div class="meta"><span>${count} task${count!==1?"s":""}</span></div>
    `;
    card.onclick = ()=>{ state.view="list"; state.list=id; state.tab="All"; render(); };
    grid.appendChild(card);
  });
  const newCard = el("button","new-list-card",`<div class="plus-ic">+</div> Create new list`);
  newCard.onclick = ()=>alert("Naming a new list would go here ✨");
  grid.appendChild(newCard);
  container.appendChild(grid);

  container.appendChild(el("div","section-title","Overview"));
  const ring = pct;
  const overview = el("div","overview-card",`
    <div class="ring-wrap">
      <svg width="86" height="86" viewBox="0 0 86 86">
        <circle cx="43" cy="43" r="36" fill="none" stroke="var(--cream-deep)" stroke-width="10"/>
        <circle cx="43" cy="43" r="36" fill="none" stroke="var(--teal)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="${2*Math.PI*36}"
          stroke-dashoffset="${2*Math.PI*36*(1-ring/100)}"
          transform="rotate(-90 43 43)"/>
        <text x="43" y="49" text-anchor="middle" font-family="Baloo 2" font-weight="700" font-size="18" fill="var(--ink)">${ring}%</text>
      </svg>
    </div>
    <div class="stat"><span class="num">${total}</span><span class="lbl">Total</span></div>
    <div class="overview-divider"></div>
    <div class="stat done"><span class="num">${done}</span><span class="lbl">Done</span></div>
    <div class="overview-divider"></div>
    <div class="stat pending"><span class="num">${pending}</span><span class="lbl">Pending</span></div>
  `);
  container.appendChild(overview);
}

/* ---------------- List detail view ---------------- */
function renderListView(container){
  const meta = LIST_META[state.list];
  const listTasks = tasksFor(state.list);
  const pending = listTasks.filter(t=>!t.done).length;

  const back = el("button","back-btn","← Back to lists");
  back.onclick = ()=>{ state.view="dashboard"; render(); };
  container.appendChild(back);

  const header = el("div","list-header",`
    <div class="blob" style="background:${meta.bg}">${meta.emoji}</div>
    <div>
      <h2>${meta.name}</h2>
      <p class="sub">${pending} pending</p>
    </div>
  `);
  container.appendChild(header);

  const addRow = el("div","add-row",`
    <input type="text" id="newTaskInput" placeholder="Add a new task...">
    <select id="newTaskPriority">
      <option>Low</option><option>Medium</option><option>High</option>
    </select>
    <button class="submit" id="addTaskBtn">Add</button>
  `);
  container.appendChild(addRow);

  const tabs = el("div","tabs");
  ["All","Active","Completed"].forEach(t=>{
    const tab = el("button","tab"+(state.tab===t?" active":""), t);
    tab.onclick = ()=>{ state.tab=t; render(); };
    tabs.appendChild(tab);
  });
  container.appendChild(tabs);

  let filtered = listTasks;
  if(state.tab==="Active") filtered = listTasks.filter(t=>!t.done);
  if(state.tab==="Completed") filtered = listTasks.filter(t=>t.done);

  const taskList = el("div","task-list");
  if(filtered.length===0){
    taskList.appendChild(el("div","empty-state",`
      <div class="em">
        <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="92" rx="34" ry="6" fill="var(--cream-deep)"/>
          <path d="M40 60h40l-5 32H45Z" fill="var(--coral)"/>
          <path d="M40 60h40l-2 9H42Z" fill="var(--coral-tint)"/>
          <path d="M60 60c0-22-18-24-18-24s-2 18 18 24Z" fill="var(--teal)"/>
          <path d="M60 60c0-26 20-28 20-28s3 20-20 28Z" fill="var(--teal-deep)"/>
          <path d="M60 60c0-16-13-19-13-19s-2 14 13 19Z" fill="var(--teal-tint)"/>
        </svg>
      </div>
      <p>Nothing here yet. Add a task to get started.</p>
    `));
  } else {
    filtered.forEach(t=>{
      const row = el("div",`task-row priority-${t.priority}${t.done?" done":""}`);
      row.innerHTML = `
        <button class="checkbox ${t.done?"checked":""}" data-id="${t.id}">${t.done?"✓":""}</button>
        <div class="task-body">
          <p class="task-title">${t.title}</p>
          <span class="pill ${t.priority}">${t.priority}</span>
        </div>
        <div class="task-actions">
          <button class="icon-btn">↗</button>
          <button class="icon-btn del" data-id="${t.id}">✕</button>
        </div>
      `;
      taskList.appendChild(row);
    });
  }
  container.appendChild(taskList);

  // events
  $("#addTaskBtn").onclick = addTask;
  $("#newTaskInput").onkeydown = e=>{ if(e.key==="Enter") addTask(); };
  container.querySelectorAll(".checkbox").forEach(cb=>{
    cb.onclick = ()=>{
      const t = tasks.find(x=>x.id==cb.dataset.id);
      t.done = !t.done;
      render();
    };
  });
  container.querySelectorAll(".del").forEach(btn=>{
    btn.onclick = ()=>{
      tasks = tasks.filter(x=>x.id!=btn.dataset.id);
      render();
    };
  });

  function addTask(){
    const input = $("#newTaskInput");
    const val = input.value.trim();
    if(!val) return;
    const priority = $("#newTaskPriority").value;
    tasks.push({ id:nextId++, list:state.list, title:val, priority, done:false });
    render();
  }
}

/* ---------------- Render root ---------------- */
function render(){
  renderNav();
  const content = $("#content");
  content.innerHTML = "";
  if(state.view==="dashboard") renderDashboard(content);
  else renderListView(content);
}

/* ---------------- Drawer (mobile) ---------------- */
function openDrawer(){ $("#sidebar").classList.add("open"); $("#overlay").classList.add("show"); }
function closeDrawer(){ $("#sidebar").classList.remove("open"); $("#overlay").classList.remove("show"); }
$("#hamburger").onclick = openDrawer;
$("#drawerClose").onclick = closeDrawer;
$("#overlay").onclick = closeDrawer;

$("#addListBtn").onclick = ()=>alert("Naming a new list would go here ✨");
$("#fab").onclick = ()=>{
  if(state.view==="dashboard"){ state.view="list"; state.list="personal"; render(); }
  const input = document.getElementById("newTaskInput");
  if(input) input.focus();
};

render();
</script>
</body>
</html>
